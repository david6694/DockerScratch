services:

  # MariaDB Database Service
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    image: inception-mariadb
    restart: always
    networks:
      - inception_net
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ADMIN_USER=${MYSQL_ADMIN_USER}
    secrets:
      - db_password
      - db_root_password
      - credentials

  # WordPress and PHP-FPM Service
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    image: inception-wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception_net
    volumes:
      - wp_data:/var/www/wordpress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_password
      - credentials

  # Nginx Reverse Proxy Service
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    image: inception-nginx
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception_net
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/wordpress

# Dedicated Private Bridge Network for container isolation
networks:
  inception_net:
    driver: bridge

# Persistent Named Volumes mapped to the host directory
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/devgarri/data/db_data
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/devgarri/data/wp_data

# Secure Sensitive Information via Docker Secrets
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
