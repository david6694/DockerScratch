[www]
; Run processes as the standard web user
user = www-data
group = www-data

; Listen on port 9000 of all network interfaces inside the container network
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Process manager settings for dynamic resource allocation
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; CRITICAL: Prevent PHP-FPM from wiping environment variables
; This allows PHP to read variables defined in docker-compose.yml or .env
clear_env = no
