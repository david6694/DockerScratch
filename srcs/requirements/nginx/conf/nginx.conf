server {
    # Listen on port 443 for SSL/TLS connections (IPv4 & IPv6)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Domain name associated with the site
    server_name devgarri.42.fr;

    # SSL Certificate and Private Key locations
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # CRITICAL SECURITY: Restrict protocols to TLSv1.2 and TLSv1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Path to WordPress website files
    root /var/www/wordpress;
    index index.php index.html index.htm;

    # Serve static assets or fallback to index.php for routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Route PHP requests to the WordPress container using FastCGI protocol
    location ~ \.php$ {
        # Check if the requested file actually exists to avoid execution exploits
        try_files $uri =404;

        # Forward the request to the WordPress container on port 9000
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;

        # Include standard FastCGI parameters
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
